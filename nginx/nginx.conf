upstream django_app {
    server web:8880;
}

server {
    listen 80;
    server_name _;

    location /static/ {
        alias /code/static/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
