services:
  web:
    build: .
    env_file:
      - .env
    command: >
      bash -c "
        poetry run python manage.py collectstatic --noinput &&
        poetry run python manage.py migrate &&
        poetry run python manage.py runserver 0.0.0.0:8880"
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8880:8880"
    depends_on:
      - db

  db:
    image: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    expose:
      - "5432"

  redis:
    image: redis
    volumes:
      - ./redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    depends_on:
      - db
      - web

  celery_worker:
    build:
      context: .
    command: poetry run celery -A config worker --loglevel=info --pool=eventlet
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1

  celery_beat:
    build:
      context: .
    command: poetry run celery -A config beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - celery_worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/code/static
    depends_on:
      - celery_beat
      - web

volumes:
  postgres_data:
  static_volume:
  redis_data:
